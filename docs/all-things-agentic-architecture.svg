<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title description">
  <title id="title">Video Studio Storyboard Artist and Production Planner — Google Cloud architecture</title>
  <desc id="description">A submission-ready architecture diagram showing the creator PWA, public Cloud Run API, Cloud Tasks, Firestore, private Cloud Run worker, Vertex AI, Text-to-Speech, FFmpeg and FFprobe, and a private Cloud Storage bucket. It documents deployed architecture and human-review gates without claiming that a job-specific visual result passed review. Live media evidence is packaged separately, and every generated panel requires human review. The diagram also shows durable orchestration, the project-wide image quota gate, and fail-closed completion controls.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071724"/><stop offset="0.55" stop-color="#0b1428"/><stop offset="1" stop-color="#15162f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/></filter>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#4bdcff"/></marker>
    <marker id="arrow-violet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#9886ff"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#48e3b5"/></marker>
    <style>
      .label{font-family:"Segoe UI",Arial,sans-serif;fill:#ecf7ff}.muted{font-family:"Segoe UI",Arial,sans-serif;fill:#9db2c7}.micro{font-family:"Segoe UI",Arial,sans-serif;fill:#91a9bf;font-size:15px;letter-spacing:.5px}.eyebrow{font-family:"Segoe UI",Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:3px;fill:#55ddff}.box-title{font-family:"Segoe UI",Arial,sans-serif;fill:#fff;font-size:24px;font-weight:700}.box-kicker{font-family:"Segoe UI",Arial,sans-serif;fill:#67dffc;font-size:14px;font-weight:700;letter-spacing:1.4px}.body{font-family:"Segoe UI",Arial,sans-serif;fill:#bdd0df;font-size:17px}.flow-label{font-family:"Segoe UI",Arial,sans-serif;fill:#b9eefe;font-size:14px;font-weight:700;letter-spacing:.6px}.card-title{font-family:"Segoe UI",Arial,sans-serif;fill:#fff;font-size:20px;font-weight:700}.card-body{font-family:"Segoe UI",Arial,sans-serif;fill:#b9cadd;font-size:16px}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="url(#background)"/><circle cx="1640" cy="85" r="260" fill="#2d376e" opacity=".23"/><circle cx="65" cy="1115" r="320" fill="#087b91" opacity=".14"/><path d="M0 168H1800" stroke="#263a50" stroke-width="2"/>
  <g aria-label="Diagram heading">
    <rect x="64" y="40" width="54" height="54" rx="14" fill="#2a233d" stroke="#9f784f" stroke-width="2"/><text x="91" y="75" text-anchor="middle" class="label" font-size="20" font-weight="800">VS</text>
    <text x="138" y="60" class="eyebrow">VIDEO STUDIO</text><text x="138" y="91" class="muted" font-size="17">All Things Agentic · Storyboard Artist &amp; Production Planner</text><text x="64" y="139" class="label" font-size="34" font-weight="750">Google Cloud production architecture</text>
    <rect x="1190" y="40" width="546" height="52" rx="26" fill="#173128" stroke="#48e3b5" stroke-width="2"/><circle cx="1218" cy="66" r="8" fill="#48e3b5"/><text x="1239" y="72" class="label" font-size="15" font-weight="700" letter-spacing=".55">DEPLOYED ARCHITECTURE · HUMAN REVIEW GATED</text><text x="1736" y="116" text-anchor="end" class="muted" font-size="14">LIVE MEDIA EVIDENCE PACKAGED SEPARATELY · JOB-SPECIFIC RESULTS ARE NOT CLAIMED HERE</text><text x="1736" y="142" text-anchor="end" class="muted" font-size="14">EVERY GENERATED PANEL REQUIRES HUMAN REVIEW · plan/pitch media, not filmed footage</text>
  </g>
  <rect x="45" y="195" width="1710" height="624" rx="30" fill="#07111d" fill-opacity=".76" stroke="#29465e" stroke-width="2"/><text x="74" y="225" class="micro">REQUEST + CONTROL PATH</text>
  <g id="client" filter="url(#shadow)">
    <rect x="70" y="285" width="280" height="265" rx="24" fill="#102536" stroke="#3d93b7" stroke-width="2"/><rect x="90" y="306" width="240" height="52" rx="12" fill="#15354a"/><circle cx="112" cy="332" r="8" fill="#49e1bd"/><text x="132" y="339" class="box-kicker">CREATOR / JUDGE</text>
    <text x="95" y="402" class="box-title">Installable PWA</text><text x="95" y="438" class="body">Natural chat + local script</text><text x="95" y="466" class="body">or PDF attachment</text><text x="95" y="503" class="body">Job monitor + authenticated</text><text x="95" y="531" class="body">downloads and pitch playback</text>
  </g>
  <g id="api" filter="url(#shadow)">
    <rect x="440" y="238" width="300" height="230" rx="24" fill="#151f3a" stroke="#6876d9" stroke-width="2"/><text x="468" y="275" class="box-kicker" fill="#9aa8ff">PUBLIC CONTROL PLANE</text><text x="468" y="319" class="box-title">Cloud Run API</text><text x="468" y="355" class="body">Access-code hash gate</text><text x="468" y="383" class="body">Job admission + status</text><text x="468" y="411" class="body">Job-bound artifact streaming</text><rect x="468" y="428" width="244" height="24" rx="12" fill="#252c54"/><text x="590" y="445" text-anchor="middle" class="micro">NO BUCKET URL IN BROWSER</text>
  </g>
  <g id="tasks" filter="url(#shadow)">
    <rect x="440" y="548" width="300" height="190" rx="24" fill="#1e193c" stroke="#8b73e8" stroke-width="2"/><text x="468" y="584" class="box-kicker" fill="#b7a8ff">DURABLE DISPATCH</text><text x="468" y="628" class="box-title">Cloud Tasks</text><text x="468" y="663" class="body">Named tasks · OIDC caller</text><text x="468" y="691" class="body">Concurrency 1 · bounded retry</text><text x="468" y="719" class="body">1,740 s HTTP deadline</text>
  </g>
  <g id="firestore" filter="url(#shadow)">
    <rect x="805" y="322" width="300" height="300" rx="24" fill="#102f2e" stroke="#40c4a1" stroke-width="2"/><text x="833" y="359" class="box-kicker" fill="#62e8c3">DURABLE STATE</text><text x="833" y="403" class="box-title">Firestore</text><text x="833" y="441" class="body">Fenced job + attempt lease</text><text x="833" y="469" class="body">Immutable checkpoint chain</text><text x="833" y="497" class="body">4 active-job slots</text><text x="833" y="525" class="body">Project-wide visual FIFO</text><text x="833" y="553" class="body">Cancellation + TTL record</text><rect x="833" y="570" width="244" height="34" rx="17" fill="#183d39"/><text x="955" y="592" text-anchor="middle" class="micro">ATOMIC STATE TRANSITIONS</text>
  </g>
  <g id="worker" filter="url(#shadow)">
    <rect x="1180" y="230" width="300" height="340" rx="24" fill="#122739" stroke="#4cb9df" stroke-width="2"/><text x="1208" y="267" class="box-kicker">PRIVATE EXECUTION PLANE</text><text x="1208" y="311" class="box-title">Cloud Run worker</text><text x="1208" y="349" class="body">Strict brief + compiler/audit</text><text x="1208" y="377" class="body">Two panels per dispatch</text><text x="1208" y="405" class="body">One pitch segment per card</text><text x="1208" y="433" class="body">FFmpeg + FFprobe verify</text><text x="1208" y="461" class="body">Fenced 1,800 s lease</text><rect x="1208" y="489" width="244" height="58" rx="14" fill="#173249"/><text x="1330" y="514" text-anchor="middle" class="micro">MAX INSTANCE 1 · CONCURRENCY 1</text><text x="1330" y="537" text-anchor="middle" class="micro">2 CPU · 4 GiB BASELINE</text>
  </g>
  <g id="providers" filter="url(#shadow)">
    <rect x="1545" y="213" width="180" height="112" rx="20" fill="#22203e" stroke="#8379df" stroke-width="2"/><text x="1567" y="244" class="box-kicker" fill="#b7a8ff">VERTEX AI</text><text x="1567" y="280" class="label" font-size="19" font-weight="700">Gemini 3.5 Flash</text><text x="1567" y="306" class="micro">structured brief</text>
    <rect x="1545" y="348" width="180" height="132" rx="20" fill="#152e3d" stroke="#43bddf" stroke-width="2"/><text x="1567" y="379" class="box-kicker">VERTEX AI</text><text x="1567" y="414" class="label" font-size="18" font-weight="700">Gemini image</text><text x="1567" y="440" class="micro">one 16:9 panel</text><text x="1567" y="463" class="micro">per provider call</text>
    <rect x="1545" y="503" width="180" height="122" rx="20" fill="#132f2a" stroke="#49d4a8" stroke-width="2"/><text x="1567" y="534" class="box-kicker" fill="#65e4bb">CLOUD TTS</text><text x="1567" y="569" class="label" font-size="19" font-weight="700">Chirp 3 HD</text><text x="1567" y="596" class="micro">one cue per card</text>
  </g>
  <g id="storage" filter="url(#shadow)">
    <rect x="1180" y="643" width="545" height="135" rx="24" fill="#2b2419" stroke="#e7a65f" stroke-width="2"/><text x="1208" y="678" class="box-kicker" fill="#f0b979">PRIVATE MEDIA BOUNDARY</text><text x="1695" y="678" text-anchor="end" class="micro">PUBLIC ACCESS PREVENTION</text><text x="1695" y="701" text-anchor="end" class="micro">UNIFORM BUCKET ACCESS</text><text x="1208" y="718" class="box-title">Cloud Storage</text><text x="1208" y="746" class="body" font-size="16">Create-only objects: panels, checkpoints and pitch segments</text><text x="1208" y="770" class="body" font-size="16">Private verified exports · content-addressed storage</text>
  </g>
  <g id="flows" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 367H421" stroke="#4bdcff" stroke-width="5" marker-end="url(#arrow-cyan)"/><text x="385" y="350" text-anchor="middle" class="flow-label">HTTPS</text><path d="M440 415H378Q365 415 365 435V495Q365 515 350 515" stroke="#4bdcff" stroke-width="4" marker-end="url(#arrow-cyan)"/><text x="389" y="486" class="flow-label">ARTIFACT BYTES</text>
    <path d="M590 468V531" stroke="#9886ff" stroke-width="5" marker-end="url(#arrow-violet)"/><text x="606" y="508" class="flow-label">ENQUEUE</text><path d="M740 646H1148Q1164 646 1164 630V532" stroke="#9886ff" stroke-width="5" marker-end="url(#arrow-violet)"/><text x="902" y="674" class="flow-label">OIDC NAMED SUCCESSOR</text>
    <path d="M740 360H788" stroke="#48e3b5" stroke-width="5" marker-end="url(#arrow-green)"/><text x="763" y="342" text-anchor="middle" class="flow-label">JOBS</text><path d="M1105 444H1163" stroke="#48e3b5" stroke-width="5" marker-end="url(#arrow-green)"/><path d="M1180 477H1122" stroke="#48e3b5" stroke-width="4" marker-end="url(#arrow-green)"/><text x="1148" y="460" text-anchor="middle" class="flow-label">LEASE</text>
    <path d="M1480 281H1528" stroke="#9886ff" stroke-width="4" marker-end="url(#arrow-violet)"/><path d="M1480 399H1528" stroke="#4bdcff" stroke-width="4" marker-end="url(#arrow-cyan)"/><path d="M1480 514H1528" stroke="#48e3b5" stroke-width="4" marker-end="url(#arrow-green)"/><path d="M1330 570V626" stroke="#e7a65f" stroke-width="5" marker-end="url(#arrow-cyan)"/><path d="M1180 710H780Q758 710 758 686V438Q758 415 740 415" stroke="#e7a65f" stroke-width="4" marker-end="url(#arrow-cyan)"/><text x="939" y="733" class="flow-label">AUTHENTICATED READ</text>
  </g>
  <g aria-label="Operational invariants">
    <text x="64" y="866" class="micro">REVIEWED OPERATIONAL INVARIANTS</text>
    <rect x="64" y="890" width="524" height="222" rx="24" fill="#101e31" stroke="#385b79" stroke-width="2"/><circle cx="101" cy="931" r="15" fill="#7585ff"/><text x="132" y="938" class="card-title">Durable orchestration</text><text x="94" y="978" class="card-body">• Exactly four active-job slots across hourly cohorts</text><text x="94" y="1008" class="card-body">• Checkpoint + successor state advances transactionally</text><text x="94" y="1038" class="card-body">• Attempt / sequence / lease fences reject stale tasks</text><text x="94" y="1068" class="card-body">• Exclusive bound: sequences 0–249 for 120 cards</text>
    <rect x="638" y="890" width="524" height="222" rx="24" fill="#0f2829" stroke="#348f7d" stroke-width="2"/><circle cx="675" cy="931" r="15" fill="#48e3b5"/><text x="706" y="938" class="card-title">Project-wide visual gate</text><text x="668" y="978" class="card-body">• At most two provider image requests per 75 s window</text><text x="668" y="1008" class="card-body">• Every provider call consumes one FIFO reservation</text><text x="668" y="1038" class="card-body">• Successful two-panel chunks yield for 75 seconds</text><text x="668" y="1068" class="card-body">• Provider 429 delays: 90 / 180 / 360 / 720 s</text>
    <rect x="1212" y="890" width="524" height="222" rx="24" fill="#2a2119" stroke="#a87949" stroke-width="2"/><circle cx="1249" cy="931" r="15" fill="#f0aa62"/><text x="1280" y="938" class="card-title">Fail-closed completion</text><text x="1242" y="978" class="card-body">• Every visual, narration cue and subtitle is required</text><text x="1242" y="1008" class="card-body">• FFprobe requires 1920×1080 H.264 + AAC output</text><text x="1242" y="1038" class="card-body">• Artifact bytes, order and SHA-256 are revalidated</text><text class="card-body"><tspan x="1242" y="1068">• Partial or malformed media is never</tspan><tspan x="1261" y="1094">published as success</tspan></text>
  </g>
  <path d="M64 1144H1736" stroke="#284155" stroke-width="2"/><text x="64" y="1167" class="muted" font-size="12">Trust boundary: the browser never receives a gs:// URL, public object URL, service-account key, or provider credential.</text><text x="64" y="1190" class="muted" font-size="11">Reference architecture · deployment evidence is packaged separately</text><text x="1736" y="1167" text-anchor="end" class="muted" font-size="11">Public repository and live-service links are provided separately</text><text x="1736" y="1190" text-anchor="end" class="muted" font-size="11">No job-specific acceptance claim is made in this diagram</text>
</svg>
